[project]
name = "vlfz"
version = "0.1.0"
description = "Zero-shot calibration (ECE / NLL) of SSL vision foundation models on HyperKvasir, before vs after SSL pretraining on GastroNet-5M."
requires-python = ">=3.10,<3.11"
dependencies = [
    "torch==2.5.1",
    "torchvision==0.20.1",
    "lightning>=2.4,<3",
    "timm>=1.0.15,<1.1",
    "open_clip_torch>=2.31,<4",
    "torchmetrics>=1.4,<2",
    "scikit-learn>=1.3",
    "numpy>=1.26,<3",
    "pillow>=10",
    "omegaconf>=2.3",
    "tqdm>=4.66",
    "imagehash>=4.3",
    "tensorboard>=2.14",
    "pandas>=2.0",
    "tabulate>=0.9",
    "requests>=2.31",
    # gastronet_source defaults to s3_webdataset (streamed from the AWS lake,
    # see pipeline/) -> boto3 + webdataset are on the default SSL training path.
    "boto3>=1.34",
    "webdataset>=0.2.86,<1.1",
    "wandb>=0.16",              # SSL/eval run logging (opt-in via WANDB_API_KEY)
]

[project.optional-dependencies]
dev = ["pytest>=8"]
# GastroNet-5M lake build tooling (ingest/catalog/curate/dq — see pipeline/).
# Not needed to run training/eval against an already-curated tier.
pipeline = [
    "pyarrow>=15",
    "matplotlib>=3.7",
    "prefect>=2.19; python_version < '3.13'",
]

[project.scripts]
vlfz-pretrain = "vlfz.ssl.pretrain:main"
vlfz-eval = "vlfz.eval.run_eval:main"
vlfz-aggregate = "vlfz.report.aggregate:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["vlfz*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

# VLF_Zeiss — central config (OmegaConf). Env vars override via ${oc.env:VAR,default}.
# On the LRZ cluster, lrz/job_env.sh exports DATA_ROOT / OUT_ROOT before any job runs.

paths:
  data_root: ${oc.env:DATA_ROOT,./data}
  # DSS project scratch is full -> keep outputs on the home quota (~100 GB).
  out_root:  ${oc.env:OUT_ROOT,'~/vlf_zeiss_runs'}

  # HyperKvasir (staged, read-only). Contains hyper_kvasir_{labeled,unlabeled,segmented}_images/.
  hyperkvasir: ${oc.env:HKV_ROOT,${paths.data_root}}

  # GastroNet-5M (authorised; cortex.thetavision.nl). Layout: <gastronet>/*.zip (<=10k PNGs per shard).
  gastronet: ${oc.env:GASTRONET_ROOT,'~/vlf_zeiss_data/gastronet5m'}

  # REAL-Colon (dropped for now; loader kept for later).
  realcolon: ${oc.env:REALCOLON_ROOT,${paths.data_root}/real_colon}

  # cached derived artefacts (manifests, splits, feature caches, results)
  cache:   ${paths.out_root}/cache
  results: ${paths.out_root}/results
  ckpts:   ${paths.out_root}/ssl

backbones:
  # ViT-B/16 @ 224, feature = LayerNorm(mean over patch tokens) -> 768-d
  arch: vit_base_patch16_224
  img_size: 224
  # SigLIP-2 vision tower: try this timm tag first, else open_clip fallback (see load_weights.py).
  # *_gap_* = global-average-pool head (no attention-pool module); trunk weights are identical.
  siglip2_timm_tag: vit_base_patch16_siglip_gap_224.v2_webli
  siglip2_timm_tag_alt: vit_base_patch16_siglip_224.v2_webli
  siglip2_openclip: ["ViT-B-16-SigLIP2", "webli"]
  # ImageNet init: torchvision vit_b_16 IMAGENET1K_V1, converted into the timm module
  imagenet_tv_weights: IMAGENET1K_V1
  # ImageNet normalisation used for ALL eval feature extraction and ImageNet-init SSL.
  # SigLIP-2 native norm is [0.5]*3; we standardise on ImageNet norm for a single eval path
  # (documented deviation; parity test in tests/test_backbone_parity.py accounts for it).
  norm_mean: [0.485, 0.456, 0.406]
  norm_std:  [0.229, 0.224, 0.225]

ssl:
  stage: ${oc.env:STAGE,smoke}
  objective: ${oc.env:OBJ,lejepa}          # lejepa | dino
  init: ${oc.env:INIT,siglip2}             # siglip2 | imagenet
  lora: false                              # full-backbone by default; --lora is a fallback
  corpus: ${oc.env:CORPUS,gastronet}       # gastronet | hkv_unlabeled (staged 99k fallback)
  # GastroNet-5M read path (see pipeline/README.md):
  #   local_webdataset -> $GASTRONET_ROOT/webdataset/*.tar  (curated tier, default)
  #   local_zip        -> $GASTRONET_ROOT/*.zip             (raw portal shards)
  #   s3_webdataset    -> s3://$GASTRONET_BUCKET/webdataset/ (stream; egress $$ per pass)
  # Default = stream from the S3 lake with a local shard cache: epoch 1 fetches
  # each .tar over presigned HTTPS (one-time egress ~$5 for the curated tier),
  # every later epoch / job resubmit reads $GASTRONET_ROOT/.wds_cache instead.
  gastronet_source: ${oc.env:GASTRONET_SOURCE,local_webdataset}
  gastronet_bucket: ${oc.env:GASTRONET_BUCKET,''}
  wds_cache_dir: ${oc.env:WDS_CACHE_DIR,${paths.gastronet}/.wds_cache}
  wds_cache_size_bytes: -1                 # -1 = unlimited (curated tier is ~50 GB)
  s3_presign_seconds: 86400                # presigned GET URL lifetime (regenerated per job launch)
  wds_images_per_shard: 10000              # curate_shard.py --pack; used to size an epoch
  steps_per_epoch: ${oc.env:STEPS_PER_EPOCH,0}   # 0 -> derive from shard count / bs
  # local_zip only: class/shard-balanced image subset (full webdataset tier ignores this)
  subset_images: ${oc.env:SUBSET_IMAGES,700000}
  batch_size: 128
  grad_accum: 1
  num_workers: 12
  base_lr: ${oc.env:BASE_LR,1.0e-4}
  min_lr: ${oc.env:MIN_LR,1.0e-6}
  weight_decay: 0.05
  warmup_frac: 0.1
  llrd: ${oc.env:LLRD,0.75}                # layer-wise LR decay
  grad_clip: 3.0
  ema_base: 0.9995                         # backbone weight-EMA (eval artefact)
  ckpt_every_steps: 500
  smoke: {epochs: 1, max_images: 2000, batch_size: 16, num_workers: 4}
  full:  {epochs: "${oc.env:SSL_EPOCHS,8}", max_images: 0}   # 0 -> use ssl.subset_images

  lejepa:
    proj_dim: 512
    pred_hidden_mult: 2
    sigreg_lambda: 1.0
    var_weight: 1.0
    sigreg_slices: 256
    sigreg_freqs: 16
  dino:
    out_dim: 8192
    n_local: 6
    global_scale: [0.4, 1.0]
    local_scale: [0.05, 0.4]
    student_temp: 0.1
    teacher_temp: 0.04
    teacher_temp_final: 0.07
    teacher_temp_warmup_frac: 0.3
    center_momentum: 0.9
    ibot: false
    mask_ratio: 0.3

aug:            # endoscopy-safe SSL views: NO horizontal/vertical flip (laterality), NO grayscale
  rrc_scale: [0.5, 1.0]
  rotation_deg: 15
  color_jitter: [0.3, 0.3, 0.3, 0.05]
  blur_p: 0.3

hyperkvasir:
  # classification tasks: hkv_findings (23) | hkv_category (4) | hkv_tract (2) | hkv_pathology (2)
  tasks: ${oc.env:HKV_TASKS,'hkv_findings,hkv_category,hkv_tract,hkv_pathology'}
  min_class: 12            # hkv_findings: drop leaf classes with fewer images than this
  split:
    seed: 0
    ref_frac: 0.60        # k-NN support
    cal_frac: 0.15        # temperature / evidence-scale fit
    # remainder (~0.25) -> query (held-out test)
    # leakage mitigation: HyperKvasir has no procedure id, so near-duplicate
    # frames can straddle splits. Drop every cal/query image within
    # phash_max_dist bits of ANY reference image before scoring. Deduped splits
    # cache to hkv_splits_dd<N>.json (raw split untouched).
    phash_dedup: true
    phash_max_dist: 6
  seg:
    n_support: 100        # labelled polyp masks used as the k-NN dense-label support set
    patch_k: 10
    patch_tau: 0.1

realcolon_tasks:   # dropped for now; kept so vlfz.data.realcolon still imports
  frame:  {neg_per_pos: 3, frame_stride: 5, min_box_area_frac: 0.0}
  lesion: {crop_margin: 0.25, max_frames_per_lesion: 40,
           adenoma: ["AD"], non_adenoma: ["HP", "SSL", "TSA"], drop: ["NO POLYP", "OTHER", ""]}
  split:  {seed: 0, n_query: 24, n_reference: 28, n_cal: 8, stratify_on: ["study_id"]}

eval:
  img_size: 224
  batch_size: 256
  num_workers: 8
  knn_k: 20
  knn_tau: 0.07
  knn_k_sweep: [10, 20, 50, 200]
  feature_l2norm: true

calibration:
  n_bins: 15
  adaptive_bins: 15
  temp_max_iter: 100

# Weights & Biases. Opt-in: any WANDB_API_KEY in the environment turns it on
# (lrz/job_env.sh exports it from ~/.wandb_key). Run dirs + cache go on
# $MCMLSCRATCH via WANDB_DIR (never the home quota). Set WANDB_MODE=offline on a
# firewalled node and `wandb sync $MCMLSCRATCH/wandb` from the login node after.
wandb:
  enabled: ${oc.env:WANDB_ENABLED,false}     # force-on without a key (e.g. offline)
  project: ${oc.env:WANDB_PROJECT,vlf-zeiss}
  entity:  ${oc.env:WANDB_ENTITY,''}          # '' -> the key's default (personal) entity

seed: 0
